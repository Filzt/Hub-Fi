# skyhub — integração Mercado Livre <-> Sankhya da Skyline.
# MODO controla a escrita no Sankhya:
#   sombra     — só lê e monta o pedido; nunca grava
#   manual     — grava parceiro + pedido 1090 só pelo botão do painel / POST .../gravar
#   automatico — grava sozinho ao receber a notificação do ML

name = "skyhub"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# Estado em Durable Objects com SQLite: não exige criar D1/Queue/R2 antes do
# primeiro deploy (o build do GitHub funciona sem provisionamento manual).
[[durable_objects.bindings]]
name = "MELI_TOKEN"
class_name = "MeliToken"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeliToken", "Store"]

# Reprocessa eventos pendentes/com erro (retry com backoff) — rede de segurança
# para o webhook, que o ML descarta após 1 h de tentativas.
[triggers]
crons = ["*/10 * * * *"]

[vars]
MODO = "automatico" # sombra | manual (grava só pelo botão) | automatico (grava pelo webhook)
XML_MODO = "automatico" # manual (envio do XML só pelo painel) | automatico (cron envia sozinho)
CANCELAMENTO_MODO = "automatico" # desligado | manual | automatico — cancela no Sankhya o 1090 NÃO faturado de venda cancelada no ML
ESTOQUE_MODO = "automatico" # sombra (só planeja, mostra no painel) | automatico (aplica quantidade no ML)
PRECO_MODO = "automatico" # sombra | automatico — régua: tabela 0 × 1,1236 + 70
MELI_API = "https://api.mercadolibre.com"
MELI_USER_ID = "3474041384"
SANKHYA_API = "https://api.sankhya.com.br"

# Segredos (nunca aqui — `npx wrangler secret put <NOME>` ou painel da Cloudflare):
#   MELI_CLIENT_ID, MELI_CLIENT_SECRET
#   SANKHYA_CLIENT_ID, SANKHYA_CLIENT_SECRET, SANKHYA_XTOKEN
#   ADMIN_TOKEN  (protege /api e o painel)
