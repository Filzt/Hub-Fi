# skyhub-vigia: avisa no celular (Telegram; ntfy como 2ª tentativa) quando a rodada automática do skyhub para.
# Deploy: npx wrangler deploy -c vigia/wrangler.toml   (a partir da raiz do repo)
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (cofre, via scripts/guardar_telegram.py) e NTFY_TOPIC
# (cofre: NTFY_TOPIC_SKYHUB)
name = "skyhub-vigia"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# Store do skyhub (Durable Object de outro script): lê "ultimo_erp_em"/"cron_etapa" e guarda
# o próprio estado em "vigia_estado".
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"
script_name = "skyhub"

[triggers]
crons = ["*/5 * * * *"]

[vars]
PAINEL_URL = "https://skyhub.olivera-kaique2004.workers.dev"
